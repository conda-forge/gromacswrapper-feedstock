schema_version: 1

context:
  name: gromacswrapper
  version: "0.9.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: df0678475ecd0fd133ec34c2fbcaf6a6f46d0b574b3b6f1b5b19b920669ec029

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=42
    - versioningit
    - wheel
  run:
    - matplotlib-base
    - numkit
    - numpy >=1.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gromacs
        - gromacs.fileformats
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Python wrapper around the Gromacs tools.
  license: GPL-3.0-or-later
  license_file: COPYING
  description: |
    GromacsWrapper is a Python package that wraps system calls to GROMACS
    tools into thin classes. This allows for fairly seamless integration
    of the GROMACS tools into Python scripts.


  homepage: https://github.com/Becksteinlab/GromacsWrapper
  repository: https://github.com/Becksteinlab/GromacsWrapper
  documentation: https://gromacswrapper.readthedocs.io/

extra:
  recipe-maintainers:
    - orbeckst
    - njzjz
